<div class="header-container">
  <div class="logo-container">
    <a (click)="toggleSidebar()" href="#" class="sidebar-toggle" aria-label="Toggle sidebar">
      <i class="fas fa-bars"></i>
    </a>
    <a class="logo" href="#" (click)="navigateHome()" aria-label="BeatFlow home">
      <span class="logo-mark">Beat</span><span class="logo-accent">Flow</span>
    </a>

    <!-- Waveform decorativo inline -->
    <div class="wave-bars" aria-hidden="true">
      <span class="wb wb-1"></span>
      <span class="wb wb-2"></span>
      <span class="wb wb-3"></span>
      <span class="wb wb-4"></span>
      <span class="wb wb-5"></span>
      <span class="wb wb-6"></span>
      <span class="wb wb-7"></span>
    </div>
  </div>
</div>

<div class="header-container">
  <nb-actions size="small">
    <nb-action class="control-item" title="Buscar">
      <a routerLink="/explore" class="header-icon-btn">
        <i class="fas fa-search"></i>
      </a>
    </nb-action>
    <nb-action class="control-item" title="Mis playlists">
      <a routerLink="/playlists" class="header-icon-btn">
        <i class="fas fa-list-music"></i>
      </a>
    </nb-action>
    <nb-action class="control-item" title="Analítica">
      <a routerLink="/analytics" class="header-icon-btn">
        <i class="fas fa-chart-bar"></i>
      </a>
    </nb-action>
    <nb-action class="user-action" *nbIsGranted="['view', 'user']">
      <nb-user
        [nbContextMenu]="userMenu"
        [onlyPicture]="userPictureOnly"
        [name]="user?.name"
        [picture]="user?.picture">
      </nb-user>
    </nb-action>
  </nb-actions>
</div>
